<style>
:root{--bg:#141614;--bg2:#202820;--ink:#F1EFE7;--mut:rgba(241,239,231,.72);--sage:#A9B89B;--terra:#C85C45;--gold:#E5CB87;--ln:#3a463a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .4em}h1{font-size:2.8rem}h2{font-size:1.6rem}h3{font-size:1.2rem}
#v{max-width:520px;margin:0 auto;padding:14px 18px calc(100px + env(safe-area-inset-bottom,0px));overflow-x:hidden}

.b{min-height:52px;padding:0 22px;border-radius:26px;border:1.5px solid var(--sage);background:transparent;font-weight:600}
.b.p{background:var(--gold);color:#141614;border-color:var(--gold)}.b:disabled{opacity:.4}
button:focus-visible,.ly:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.bar{display:flex;gap:10px;margin-top:12px}.bar .b{flex:1;padding:0 8px}
#n{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--ln);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
#n div{max-width:520px;margin:auto;display:flex;gap:10px}#n .b:last-child{flex:1}
.strip{display:flex;gap:4px;margin-bottom:12px}.strip button{flex:1;min-height:44px;background:none;border:0;border-top:4px solid var(--ln);font-size:.65rem;color:var(--mut);padding:6px 0 0}
.strip .d{border-color:var(--sage)}.strip .c{border-color:var(--gold);color:var(--gold);font-weight:600}
.gd{background:#2d3f2d;border-radius:16px 16px 16px 4px;padding:12px 14px;margin-bottom:12px;font-weight:500;animation:in .6s both}
.stage{background:var(--ink);border-radius:20px;margin:10px 0}svg{display:block;width:100%;height:auto}
.ly{cursor:pointer;transition:transform .8s cubic-bezier(.5,0,.2,1),opacity .4s;transform-origin:150px 200px;transform-box:view-box}
.split .ly{transform:translateY(var(--dy)) scale(var(--sc))}.ly.on{filter:drop-shadow(0 0 6px #141614)}.dim .ly:not(.on){opacity:.25}
.lbl{font:600 13px Inter,sans-serif;fill:#141614;opacity:0;transition:opacity .6s .3s;pointer-events:none}.split .lbl{opacity:1}
.panel{background:var(--bg2);border-radius:18px;padding:16px;margin-top:10px}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ln)}.dots i.s{background:var(--sage)}.dots i.c{background:var(--gold);transform:scale(1.3)}
.dato{border-left:3px solid var(--terra);padding-left:12px;margin:12px 0}
.tech{display:none;margin-top:8px;padding:10px;background:var(--bg);border-radius:12px}.tech.show{display:block}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--ln);background:none;margin:0 6px 8px 0}.chip[aria-pressed=true]{background:var(--sage);color:#141614;border-color:var(--sage)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 0;align-items:center}
.st{flex:0 0 96px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg2);padding:6px 4px;font-size:.72rem;text-align:center}.st.pl{animation:in .5s both}.st[aria-pressed=true]{border-color:var(--gold);background:#2d382d}
.ar{flex:0 0 auto;color:var(--sage)}
@keyframes in{from{opacity:0;transform:translateX(16px)}}
table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--gold)}
input[type=range]{width:100%;height:44px;accent-color:var(--gold)}label{display:flex;justify-content:space-between;font-weight:500}
.big{font:700 2.6rem Fraunces,Georgia,serif;color:var(--gold)}
.opt{display:block;width:100%;text-align:left;min-height:50px;padding:10px 14px;margin:8px 0;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg2)}.opt.ok{border-color:var(--sage);background:#2d3f2d}.opt.no{border-color:var(--terra)}
.float{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Academia submenu */
.academy-menu{display:grid;gap:22px;margin:18px 0 30px}
.academy-menu-head{padding:20px 0 12px;border-bottom:1px solid var(--ln)}
.academy-menu-head .eyebrow{font-size:.68rem;letter-spacing:.16em;color:var(--gold);font-weight:700}
.academy-menu-head h2{margin:8px 0;font-size:clamp(1.8rem,5vw,2.6rem)}
.academy-menu-head p{max-width:620px}
.academy-group h3{font-size:1rem;margin:0 0 10px}
.academy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.academy-module{position:relative;text-align:left;min-height:126px;padding:15px;border:1px solid var(--ln);border-radius:14px;background:var(--bg2);color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.academy-module:disabled{opacity:.64;cursor:default}
.academy-module .mod-no{font-size:.66rem;letter-spacing:.13em;color:var(--gold)}
.academy-module strong{display:block;font-size:1rem;line-height:1.2}

.academy-module .mod-foot{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;letter-spacing:.08em;color:var(--muted)}
.academy-module.active{border-color:rgba(196,130,90,.5)}

.academy-module .soon{border:1px solid var(--ln);border-radius:20px;padding:3px 7px;font-size:.58rem;letter-spacing:.08em}
.academy-back{margin:0 0 14px}
@media(min-width:680px){.academy-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.academy-module{min-height:145px;padding:18px}}

.academy-resources{margin-top:28px;padding-top:22px;border-top:1px solid var(--ln)}
.resource-head{margin-bottom:14px}.resource-head .eyebrow{font-size:.66rem;letter-spacing:.15em;color:var(--gold)}
.resource-head h2{margin:7px 0;font-size:1.55rem}
.resource-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.resource-tools input{flex:1;min-width:190px;background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:12px;color:var(--tx);font:inherit}
.glossary-list,.theory-list{display:grid;gap:8px}
.glossary-entry,.theory-card{border:1px solid var(--ln);border-radius:10px;padding:12px;background:var(--bg2)}
.glossary-entry summary{cursor:pointer;font-weight:650;display:flex;justify-content:space-between;gap:12px;list-style:none}
.glossary-entry summary::-webkit-details-marker{display:none}
.glossary-entry p,.theory-body{margin:10px 0 0;color:var(--muted);font-size:.88rem;line-height:1.6}
.term-cat{font-size:.62rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.theory-card{padding:0;overflow:hidden}.theory-card button{width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:15px;display:flex;justify-content:space-between;gap:12px;font:inherit}
.theory-card button small{display:block;color:var(--muted);margin-top:5px}.theory-body{padding:0 15px 16px}.theory-body h4{color:var(--tx);font-size:.9rem;margin:12px 0 5px}

.related-panel{margin:26px 0 18px;padding:18px;border:1px solid var(--ln);border-radius:14px;background:var(--bg2)}
.related-panel .eyebrow{font-size:.64rem;letter-spacing:.15em;color:var(--gold)}
.related-panel h3{margin:7px 0}.related-chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.inline-link,.related-note,.related-all{border:1px solid var(--ln);border-radius:20px;padding:7px 11px;background:transparent;color:var(--tx);font:inherit;font-size:.8rem;cursor:pointer}
.inline-link{color:var(--gold);border-color:rgba(196,130,90,.35)}
.related-note{display:block;border-radius:8px;margin:7px 0;text-align:left;width:100%}
.related-all{margin-top:9px;border:0;padding-left:0;color:var(--gold)}
.related-reading{margin-top:8px}
.glossary-entry[open]{border-color:rgba(196,130,90,.55)}
.glossary-entry[open] summary:after{content:'−';color:var(--gold)}
.glossary-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.post-guide{margin-top:18px}.post-hero{padding:18px;border:1px solid var(--ln);border-radius:14px;background:var(--bg2)}
.post-hero h3{margin:8px 0}.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.post-tags span{border:1px solid var(--ln);border-radius:20px;padding:5px 9px;font-size:.73rem;color:var(--gold)}
.post-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.post-cell{padding:12px;border:1px solid var(--ln);border-radius:11px}.post-cell strong{display:block;font-size:.76rem;color:var(--gold);margin-bottom:6px}.post-cell p{margin:0;font-size:.83rem;line-height:1.55}
.post-subtitle{margin:20px 0 8px}.post-variants{display:grid;gap:8px}.post-variants details{border:1px solid var(--ln);border-radius:10px;padding:12px}.post-variants summary{cursor:pointer;font-weight:650}.post-variants p{font-size:.85rem;line-height:1.6;color:var(--muted)}
.post-lesson{padding:14px;border-left:3px solid var(--gold);background:var(--bg2);border-radius:0 10px 10px 0;margin:15px 0}.post-lesson p{font-size:.86rem;line-height:1.6;margin:7px 0}
.post-compare{overflow-x:auto}.post-compare table{min-width:550px}.post-compare td,.post-compare th{vertical-align:top}
.post-recipe{padding:15px;border:1px solid var(--ln);border-radius:12px;margin:12px 0}.post-recipe h4{margin:0 0 8px}.post-recipe p{font-size:.85rem;line-height:1.55}
.post-recipe button{margin-top:8px}
@media(max-width:390px){.post-grid{grid-template-columns:1fr}}

.post-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 22px}
.post-tabs button{min-height:62px;padding:10px 8px;border:1px solid var(--ln);border-radius:12px;background:var(--bg2);color:var(--mut);font:inherit;font-size:.78rem;line-height:1.25}
.post-tabs button[aria-pressed="true"]{border-color:var(--terra);color:var(--gold);background:#211c18}
.post-tabs button span{display:block;font-size:.62rem;letter-spacing:.1em;margin-bottom:4px;color:var(--terra)}
.post-section-intro{margin:0 0 18px;max-width:760px}.post-section-intro h3{margin:0 0 7px;font-size:1.35rem}.post-section-intro p{margin:0;color:var(--mut);line-height:1.7}
.post-card-list{display:grid;gap:14px;margin:16px 0}.post-card{padding:18px;border:1px solid var(--ln);border-radius:14px;background:var(--bg2)}

.post-card .post-label{display:block;margin:14px 0 4px;font-size:.66rem;letter-spacing:.12em;color:var(--terra);font-weight:700}
.post-card .post-tags{margin:8px 0 12px}.post-card details{margin-top:12px;border-top:1px solid var(--ln);padding-top:11px}.post-card details summary{cursor:pointer;font-weight:600}.post-card details p{color:var(--mut)}
.post-note{padding:15px 16px;margin:18px 0;border-left:3px solid var(--terra);border-radius:0 10px 10px 0;background:#1d1a17}.post-note strong{display:block;margin-bottom:5px;color:var(--gold)}.post-note p{margin:0;color:var(--mut);font-size:.88rem;line-height:1.65}
.post-steps-wrap{padding:18px 12px;margin:14px 0;border:1px solid var(--ln);border-radius:14px;background:var(--bg2);overflow-x:auto}.post-steps-wrap .steps{min-width:520px}
.post-compare-table{overflow-x:auto;margin:18px 0}.post-compare-table table{min-width:580px}.post-compare-table th,.post-compare-table td{padding:12px;line-height:1.55;vertical-align:top}.post-compare-table th{color:var(--gold)}
@media(max-width:420px){.post-tabs{gap:5px}.post-tabs button{font-size:.7rem;padding:8px 5px}.post-card{padding:15px}.post-grid{grid-template-columns:1fr}}

function postDryingView(){return `<div class="post-section-intro"><h3>Métodos de secado</h3><p>El secado reduce la humedad del café hasta un nivel estable para su almacenamiento. Es una etapa de control de agua, energía y tiempo, no una categoría equivalente a lavado, natural o honey.</p></div><div class="post-note"><strong>Una distinción fundamental</strong><p>Lavado, natural y honey describen rutas de procesamiento y cuánto tejido del fruto permanece alrededor del grano. Patio, cama elevada, marquesina y secador mecánico describen dónde y cómo se seca. Cualquiera de estas rutas puede combinarse con distintas tecnologías.</p></div><div class="post-card-list">${POST_DRYING.map(f=>`<article class="post-card"><h3>${f.name}</h3><p>${f.desc}</p><span class="post-label">VENTAJA OPERATIVA</span><p>${f.strength}</p><span class="post-label">QUÉ CONTROLAR</span><p>${f.control}</p><span class="post-label">RIESGOS</span><p>${f.risk}</p></article>`).join('')}</div><div class="post-note"><strong>¿El método de secado aporta sabores?</strong><p>No conviene asociar una nota específica a una cama elevada, patio o secador. Un secado uniforme y bien controlado puede ayudar a preservar limpieza y estabilidad. El secado deficiente puede favorecer notas mohosas, terrosas, fenólicas o avinagradas.</p></div>`}

function post(){if(S.postTab==='fermentation')return postTabs()+postFermentationView();if(S.postTab==='drying')return postTabs()+postDryingView();const[,st]=RT[S.rt],k=st[S.ps],d=D[k];let h=postTabs();h+=`<div class="post-section-intro"><h3>Procesos principales</h3><p>Elegí una ruta para observar qué partes del fruto se retiran, qué se conserva alrededor de la semilla y qué condiciones se generan antes del secado.</p></div>`;h+=Object.keys(RT).map(r=>`<button class="chip" aria-pressed="${S.rt===r}" data-a="rt" data-v="${r}">${RT[r][0]}</button>`).join('');h+=`<div class="post-steps-wrap"><div class="steps">`+st.map((s,i)=>`<button class="st ${S.pl?'pl':''}" style="animation-delay:${i*.35}s" aria-pressed="${S.ps===i}" data-a="ps" data-v="${i}">${cb(D[s][1],D[s][2],D[s][1][4])}${D[s][0]}</button>${i<st.length-1?'<span class="ar">›</span>':''}`).join('')+`</div></div>`;h+=`<p class="m">Cada ilustración representa las capas que conserva el grano en esa etapa. Las operaciones pueden variar según la finca y el protocolo.</p><article class="post-card"><h3>${d[0]}</h3><span class="post-label">QUÉ SUCEDE</span><p>${d[3]}</p><span class="post-label">QUÉ CONTROLAR</span><p>${d[4]}</p><span class="post-label">RIESGOS</span><p>${d[5]}</p></article>`;h+=`<div class="post-compare-table"><table><tr><th></th><th>Lavado</th><th>Natural</th><th>Honey</th></tr><tr><th>Se retira antes del secado</th><td>Piel, pulpa y mucílago (según método)</td><td>No se retiran las capas externas antes del secado</td><td>Piel y pulpa; queda mucílago adherido</td></tr><tr><th>Fermentación</th><td>Puede ser en tanque o mediante otros sistemas; también existe remoción mecánica</td><td>Ocurre durante el secado de la cereza entera</td><td>Puede ocurrir durante el secado con mucílago retenido</td></tr><tr><th>Riesgo a vigilar</th><td>Lavado, higiene y fermentación</td><td>Secado desigual y mohos</td><td>Aglomeración y secado desigual</td></tr></table></div>`;return h+postGuide()+(S.pv.length>=3?ask('p'):'')}
