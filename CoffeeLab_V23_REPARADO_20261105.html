function mol(){return `<div class="grind-intro"><div><span class=k>UNA VARIABLE, MUCHAS CONSECUENCIAS</span><h3>La molienda define cómo interactúa el agua con el café.</h3><p>No existe una molienda ideal para todos los métodos. El tamaño medio importa, pero también la distribución de partículas, la proporción de finos y la consistencia del molino.</p></div><div class="grind-stat"><b>µm</b><span>Micrómetros: unidad para expresar el tamaño de las partículas.</span></div></div><section class="grind-explorer"><div class="grind-section-title"><span class=k>01 · EXPLORADOR DE TAMAÑO</span><h3>Mové el punto de molienda</h3><p>Observá cómo cambia el tamaño medio orientativo según el método. No es una receta universal ni una calibración real de tu molino.</p></div><label for=gr5>De más fino a más grueso <span id=gl5></span></label><input type=range id=gr5 data-gr=1 min=1 max=5 value='${S.gr5}'><div class=stage style='background:var(--bg2);padding:10px'><div id=mc></div></div><div id=grind-reading class="grind-reading"></div></section><div class="grind-concepts"><article class="grind-concept"><span class=k>02 · DISTRIBUCIÓN</span><h3>No todas las partículas son iguales</h3><div class="particle-visual"><span class="particle fine"></span><span class="particle medium"></span><span class="particle coarse"></span></div><p><b>Finos:</b> partículas pequeñas que ofrecen mucha superficie de contacto. Pueden extraerse rápido y migrar entre los espacios de la cama, aumentando la resistencia al flujo.</p><p><b>Partículas grandes:</b> tienen menos superficie relativa y pueden quedar menos extraídas si el contacto es insuficiente.</p><p><b>Distribución:</b> dos molinos pueden producir un tamaño medio parecido, pero proporciones distintas de finos y partículas grandes.</p></article><article class="grind-concept"><span class=k>03 · QUÉ CAMBIA EN LA TAZA</span><h3>Relación con el flujo y la extracción</h3><ul><li>Más fino suele aumentar la resistencia y el tiempo de contacto.</li><li>Más grueso suele facilitar el paso del agua y reducir el contacto.</li><li>Una distribución amplia puede generar extracciones desparejas.</li><li>El resultado depende también de dosis, agua, temperatura, método y técnica.</li></ul><p class=m>No traduzcas automáticamente “fino” como “amargo” ni “grueso” como “ácido”: son tendencias que hay que comprobar en la taza.</p></article></div><section class="grind-explorer"><div class="grind-section-title"><span class=k>04 · EL MOLINO TAMBIÉN IMPORTA</span><h3>Factores que afectan la molienda</h3></div><div class="grind-factor-grid"><div><b>Geometría de muelas</b><p>Planas o cónicas: su geometría puede influir en la distribución, la retención y el perfil de partículas. No permite predecir por sí sola el sabor.</p></div><div><b>Alineación y desgaste</b><p>Una alineación deficiente o muelas desgastadas pueden afectar la consistencia, la repetibilidad y la calidad de corte.</p></div><div><b>Retención y limpieza</b><p>El café retenido puede mezclarse con la molienda siguiente. La acumulación de aceites y partículas también altera el comportamiento.</p></div><div><b>Estática y aglomerados</b><p>La electricidad estática y los grumos pueden dificultar la dosificación y producir una distribución menos homogénea en el portafiltro o filtro.</p></div></div></section><section class="grind-explorer"><div class="grind-section-title"><span class=k>05 · MÉTODO DE AJUSTE</span><h3>Cómo calibrar sin perder el control</h3></div><ol class="grind-protocol"><li><b>Definí una referencia.</b> Fijá dosis, bebida objetivo, temperatura y método.</li><li><b>Medí el resultado.</b> Registrá tiempo, masa de bebida y, si tenés, TDS.</li><li><b>Probá una modificación.</b> Ajustá la molienda en pasos pequeños y mantené lo demás constante.</li><li><b>Evaluá en taza.</b> Buscá cambios en acidez, dulzor, amargor, cuerpo y final.</li><li><b>Documentá.</b> Guardá el ajuste y el resultado en Bitácora para poder repetirlo.</li></ol></section><div class="grind-diagnostic"><span class=k>06 · PISTA DE DIAGNÓSTICO</span><h3>¿Qué revisarías primero?</h3><div class="grind-diagnostic-grid"><div><b>Flujo demasiado rápido</b><p>Comprobá distribución, dosis, preparación de la cama y ajuste de molienda. Si todo lo demás está controlado, probá un punto más fino.</p></div><div><b>Flujo demasiado lento</b><p>Revisá exceso de finos, molienda demasiado fina, distribución, compactación y posibles obstrucciones.</p></div><div><b>Resultados inconsistentes</b><p>Revisá retención, limpieza, estática, técnica de distribución, frescura y consistencia de la dosis.</p></div></div><p class=m>Estas son hipótesis de diagnóstico, no reglas automáticas. Confirmá siempre con mediciones y cata.</p></div>`}
function mo(){const m=MED[S.gr5-1],X=u=>20+(Math.log(u)-Math.log(100))/(Math.log(1500)-Math.log(100))*270;let p='M20 120';for(let u=100;u<=1500;u*=1.04)p+='L'+X(u).toFixed(1)+' '+(120-Math.exp(-Math.pow(Math.log(u/m),2)/(2*.1))*90).toFixed(1);$('#mc').innerHTML=`<svg viewBox='0 0 300 150' aria-label='Esquema simplificado de distribución de partículas'><g stroke='#B9B3A3' opacity=.25><line x1=20 y1=120 x2=290 y2=120/><line x1=20 y1=20 x2=20 y2=120/></g><rect x=20 y=20 width='${X(m*.45)-20}' height=100 fill='#C4825A' opacity=.25 /><path d='${p}' fill='none' stroke='#E8DFC8' stroke-width=3 /><g fill='#B9B3A3' font-size=9 text-anchor=middle>${[100,250,500,1000].map(u=>`<text x='${X(u)}' y=138>${u} µm</text>`).join('')}<text x='${(20+X(m*.45))/2}' y=34 fill='#C4825A'>finos</text></g></svg><p class=m style='font-size:.75rem'>Esquema conceptual: la curva no representa datos de un molino específico.</p>`;$('#gl5').textContent=MN[S.gr5-1]+' · ≈'+m+' µm';const msgs=['Molienda muy fina: aumenta la superficie específica y la resistencia al paso del agua.','Molienda fina: suele ofrecer más resistencia y mayor contacto que una molienda media.','Molienda media: punto de partida frecuente para métodos de filtro, según molino y café.','Molienda media-gruesa: facilita el flujo; revisá que no quede una extracción insuficiente.','Molienda gruesa: menor superficie específica; puede requerir ajustar otras variables para lograr el contacto buscado.'];$('#grind-reading').innerHTML=`<b>${MN[S.gr5-1]} · ${msgs[S.gr5-1]}</b><p>Tomalo como orientación inicial: el tamaño real depende de las muelas, la calibración y el método.</p>`}

['Rend.',b=>b.ey?b.ey.toFixed(1)+' %':'\u2014']].map(r=>`<tr><th>${r[0]}</th><td>${r[1](c[0])}</td><td>${r[1](c[1])}</td></tr>`).join('')}</table></div>`:S.cmp.length==1?`<p class=m>Eleg\u00ed otro registro para comparar.</p>`:'')+(ey.length>1||td.length>1?`<div class=panel><div class=k>Evoluci\u00f3n</div>${spark(ey,18,22,'Rendimiento (%), zona 18 a 22')}${spark(td,1.15,1.35,'TDS (%), zona 1,15 a 1,35')}</div>`:'')}
